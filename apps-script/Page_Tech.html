<!-- หน้าติดตาม/ยืนยันสเปคของช่าง (เข้าด้วย token ในลิงก์) -->
<?!= include('Style'); ?>
<header class="top">
  <div class="t" id="h_title">🔧 กำลังโหลด...</div>
  <div class="s" id="h_sub"></div>
</header>

<div class="wrap">
  <div class="card" style="position:sticky;top:52px;z-index:15">
    <label class="req" style="margin-top:0">ฉันคือ <span class="en">/ I am (ผู้กดยืนยัน)</span></label>
    <input id="me" list="techlist" placeholder="เลือกหรือพิมพ์ชื่อของคุณ" autocomplete="off">
    <datalist id="techlist"></datalist>
    <div class="muted small">ระบบจะบันทึกชื่อและเวลาที่กดทุกครั้ง</div>
  </div>

  <div class="banner info">
    <b>หน้านี้ให้ช่างดู “สเปค” อย่างเดียว</b><br>
    <span class="small">เรื่องราคาและการเลือกผู้ขาย ฝ่ายจัดซื้อกับผู้บริหารดูแลให้
    / You only confirm that the specification is right.</span>
  </div>

  <div id="list"></div>
  <div style="height:10px"></div>
  <div class="card">
    <button class="btn" onclick="load(true)">🔄 รีเฟรชสถานะ</button>
  </div>
</div>

<div id="lightbox" onclick="zoomClose()">
  <img id="lb-img" src="" alt="">
  <div class="lb-bar"><a id="lb-open" href="#" target="_blank" rel="noopener" onclick="event.stopPropagation()">เปิดไฟล์ต้นฉบับ</a><span>แตะเพื่อปิด</span></div>
</div>

<?!= include('ClientLib'); ?>
<script>
var BOOT = <?!= jsonFor_(DATA) ?>;
var TOKEN = BOOT.token;
var DTO = null;

var STAGE_CLASS = {
  NEED_SPEC: 'y', TECH_SPEC: 'b', SPEC_CHANGE: 'y', QUOTING: 'b', APPROVAL: 'y',
  TO_PO: 'g', ORDERED: 'g', LOCAL_BUY: 'y', DONE: 'g', MGR_REJECTED: 'r', CANCELLED: 'r'
};

function me() { return $('#me').value.trim(); }
function needMe() {
  if (!me()) { toast('กรุณาเลือก/พิมพ์ชื่อของคุณก่อน', 'err'); $('#me').focus(); return true; }
  lsSet('tech_name', me());
  return false;
}

function load(showToast) {
  api('apiGetRequest', TOKEN).then(function (d) {
    DTO = d;
    render();
    if (showToast) toast('อัปเดตแล้ว', 'ok');
  }).catch(function (e) { toast(e.message, 'err'); });
}

function render() {
  var r = DTO.request;
  $('#h_title').textContent = '🔧 ' + r.req_id + ' — ' + r.requester_name;
  $('#h_sub').textContent = 'รหัส ' + (r.emp_code || '-') + ' • ต้องการใช้ ' + (r.required_date || '-') +
    ' • ' + DTO.items.length + ' รายการ';
  $('#techlist').innerHTML = (DTO.technicians || []).map(function (t) {
    return '<option value="' + esc(t.name) + '">' + esc(t.emp_code || '') + '</option>';
  }).join('');
  if (!$('#me').value) $('#me').value = lsGet('tech_name', '') || r.requester_name || '';
  $('#list').innerHTML = DTO.items.map(itemCard).join('');
}

function kv(k, v) { return '<div class="kv"><b>' + esc(k) + '</b><span>' + v + '</span></div>'; }

function itemCard(it) {
  var h = [];
  h.push('<div class="card" id="card_' + it.item_id + '">');
  h.push('<div class="item-head"><div><h3 style="margin:0"><span class="num">' + it.seq + '</span>' +
    esc(it.tool_name) + '</h3><div class="muted small">' + esc(it.item_id) + ' • จำนวน ' +
    esc(it.qty) + ' ' + esc(it.unit) + '</div></div>' +
    '<span class="chip ' + (STAGE_CLASS[it.stage] || '') + '">' + esc(it.stageLabel.split(' / ')[0]) + '</span></div>');

  // สิ่งที่ช่างขอไว้
  h.push('<details><summary>ดูสิ่งที่ขอไว้ / What you asked</summary><div style="padding-top:4px">');
  if (it.intended_use) h.push(kv('ใช้ทำอะไร', esc(it.intended_use)));
  if (it.spec_pref) h.push(kv('สเปคที่ขอ', esc(it.spec_pref)));
  if (it.brand_pref) h.push(kv('ยี่ห้อ/รุ่นที่อยากได้', esc(it.brand_pref)));
  if (it.required_date) h.push(kv('ต้องการใช้ภายใน', esc(it.required_date)));
  if (it.item_note) h.push(kv('หมายเหตุ', esc(it.item_note)));
  if (it.ref_links) h.push(kv('ลิงก์', '<a href="' + esc(it.ref_links) + '" target="_blank" rel="noopener">เปิดลิงก์</a>'));
  if (it.photos && it.photos.length) {
    h.push('<div class="thumbs">' + it.photos.map(function (p) { return imgTag(p, 'thumb', 'รูปอ้างอิง'); }).join('') + '</div>');
  }
  h.push('</div></details>');

  if (it.pur_note) h.push('<div class="banner info"><b>ข้อความจากจัดซื้อ:</b> ' + esc(it.pur_note) + '</div>');

  h.push(specArea(it));
  h.push(benchArea(it));
  h.push(afterApprovalArea(it));
  h.push(historyArea(it));
  h.push('</div>');
  return h.join('');
}

/* ---------- สเปคที่จัดซื้อร่างมาให้ตรวจ ---------- */
function specArea(it) {
  var h = [];
  if (!it.hasSpec) {
    h.push('<div class="banner warnb small">จัดซื้อกำลังหาของที่ตรงกับที่ขอ — เดี๋ยวจะส่งสเปคมาให้ตรวจก่อน 1 ชิ้น</div>');
    return h.join('');
  }

  h.push('<div class="sec-title" style="margin-top:12px">สเปคที่จัดซื้อเสนอ / Spec to check</div>');
  h.push('<div class="opt' + (it.tech_status === 'CONFIRMED' ? ' chosen' : '') + '">');
  if (it.spec_photo) h.push(imgTag(it.spec_photo, 'photo-big', 'รูปสเปค'));
  h.push('<div style="margin-top:8px"><b>' +
    esc([it.spec_brand, it.spec_model].filter(Boolean).join(' ') || it.tool_name) + '</b>' +
    (it.tech_status === 'CONFIRMED' ? ' <span class="chip g">✔ ยืนยันแล้ว</span>' : '') +
    (it.tech_status === 'CHANGE' ? ' <span class="chip y">ขอแก้ไข</span>' : '') +
    (it.tech_status === 'REJECTED' ? ' <span class="chip r">ไม่ถูกต้อง</span>' : '') +
    '</div>');
  if (it.spec_detail) h.push('<div class="small" style="white-space:pre-wrap;margin:6px 0">' + esc(it.spec_detail) + '</div>');
  if (it.spec_link) h.push('<div class="btn-row"><a class="btn btn-sm" href="' + esc(it.spec_link) + '" target="_blank" rel="noopener">🔗 ดูหน้าสินค้า</a></div>');
  h.push('</div>');

  if (it.tech_status === 'WAITING' && !it.locked) {
    h.push('<div class="muted small" style="margin-top:6px">ของชิ้นนี้ใช้กับงานได้ไหม? ดูรูปและสเปคแล้วกดเลย</div>');
    h.push('<div class="btn-row">' +
      '<button class="btn btn-ok" onclick="decide(\'' + it.item_id + '\',\'CONFIRM\',this)">✅ สเปคถูกต้อง</button>' +
      '<button class="btn btn-warn" onclick="openReason(\'' + it.item_id + '\',\'CHANGE\')">🔄 ขอแก้ไข</button>' +
      '<button class="btn btn-danger" onclick="openReason(\'' + it.item_id + '\',\'REJECT\')">❌ ใช้ไม่ได้</button>' +
      '</div>');
    h.push('<div id="reason_' + it.item_id + '"></div>');
  } else if (it.tech_status === 'CONFIRMED') {
    h.push('<div class="banner okb small">คุณยืนยันสเปคนี้แล้ว โดย ' + esc(it.tech_by) + ' ' + fmtDT(it.tech_at) +
      '<br>ฝ่ายจัดซื้อกำลังเทียบราคาให้ แล้วผู้บริหารจะเป็นผู้อนุมัติ</div>');
  } else if (it.tech_status === 'CHANGE' || it.tech_status === 'REJECTED') {
    h.push('<div class="banner warnb small"><b>คุณแจ้งไว้ว่า:</b> ' + esc(it.tech_note) +
      '<br><span class="muted">' + esc(it.tech_by) + ' ' + fmtDT(it.tech_at) + '</span> — รอจัดซื้อส่งสเปคใหม่</div>');
  }
  return h.join('');
}

/* ---------- ราคาที่ช่างไปดูมาเองจากร้านข้างนอก ---------- */
function benchArea(it) {
  var h = [];
  var has = numOf(it.bench_price) > 0;
  h.push('<div class="sec-title" style="margin-top:14px">ราคาที่คุณไปดูมาที่ร้าน <span class="muted small">/ Your shop price</span></div>');

  if (has) {
    h.push('<div class="banner okb small"><b>' + baht(it.bench_price) + '</b> ต่อ ' + esc(it.unit) +
      ' ที่ ' + esc(it.bench_store || '-') +
      (it.bench_note ? ('<br>' + esc(it.bench_note)) : '') +
      '<br><span class="muted">ส่งโดย ' + esc(it.bench_by || '-') + ' ' + fmtDT(it.bench_at) + '</span></div>');
    if (it.bench_photo) h.push('<div class="thumbs">' + imgTag(it.bench_photo, 'thumb', 'รูปป้ายราคา') + '</div>');
  } else {
    h.push('<div class="muted small">ถ้าคุณเคยเห็นของแบบนี้ที่ร้าน (เช่น Global House) ใส่ราคาไว้ได้ ' +
      'จัดซื้อจะเอาไปเทียบกับผู้ขาย และถ้าผู้บริหารเห็นว่าร้านคุ้มกว่า อาจให้คุณไปซื้อเองเลย</div>');
  }

  if (!it.locked) {
    h.push('<div class="btn-row"><button class="btn btn-sm" onclick="openBench(\'' + it.item_id + '\')">' +
      (has ? '✏️ แก้ราคาที่ร้าน' : '🏪 ใส่ราคาที่เห็นที่ร้าน') + '</button></div>');
    h.push('<div id="bench_' + it.item_id + '"></div>');
  }
  return h.join('');
}

/* ---------- หลังผู้บริหารอนุมัติ ---------- */
function afterApprovalArea(it) {
  var h = [];
  if (it.stage === 'LOCAL_BUY') {
    var c = DTO.config.company;
    h.push('<div class="banner okb"><b>✅ ผู้บริหารอนุมัติให้คุณไปซื้อเองที่ร้าน</b><br>' +
      'วงเงิน ' + baht(it.approvedBudget) + ' • ร้าน ' + esc(it.approvedStore || '-') +
      (it.po_ref ? ('<br>เลขที่อ้างอิงเบิก: ' + esc(it.po_ref)) : '') + '</div>');
    h.push('<div class="sec-title">ข้อมูลออกใบกำกับภาษีในนามบริษัท</div>');
    h.push('<table class="cmp">' +
      '<tr><th>ชื่อบริษัท</th><td>' + esc(c.name) + '</td></tr>' +
      '<tr><th>เลขผู้เสียภาษี</th><td>' + esc(c.taxId) + '</td></tr>' +
      '<tr><th>สาขา</th><td>' + esc(c.branch) + '</td></tr>' +
      '<tr><th>ที่อยู่</th><td>' + esc(c.address) + '</td></tr></table>');
    h.push('<div class="btn-row"><button class="btn" onclick="copyCompany()">📋 คัดลอกข้อมูลบริษัท</button></div>');
    h.push('<div class="sec-title">ซื้อแล้วส่งใบเสร็จ</div>');
    h.push('<label>ราคาจริงที่จ่าย <span class="en">/ Actual price</span></label>' +
      '<input id="ap_' + it.item_id + '" type="number" inputmode="decimal" step="0.01" placeholder="บาท">');
    h.push('<label>รูปใบเสร็จ/ใบกำกับภาษี</label>' +
      '<input id="rc_' + it.item_id + '" type="file" accept="image/*,application/pdf">');
    h.push('<div class="btn-row"><button class="btn btn-primary" onclick="sendReceipt(\'' + it.item_id + '\',this)">📤 ส่งใบเสร็จ</button></div>');

  } else if (it.stage === 'APPROVAL') {
    h.push('<div class="banner warnb small">จัดซื้อเทียบราคาเสร็จแล้ว ส่งให้ผู้บริหารอนุมัติอยู่</div>');
  } else if (it.stage === 'QUOTING') {
    h.push('<div class="banner info small">จัดซื้อกำลังเทียบราคากับผู้ขายหลายเจ้า</div>');
  } else if (it.stage === 'TO_PO') {
    h.push('<div class="banner okb small">ผู้บริหารอนุมัติแล้ว — จัดซื้อกำลังเปิด PO</div>');
  } else if (it.stage === 'ORDERED') {
    h.push('<div class="banner okb small">สั่งซื้อแล้ว' + (it.po_ref ? (' (PO ' + esc(it.po_ref) + ')') : '') + ' รอของมาส่ง</div>');
  } else if (it.stage === 'DONE') {
    h.push('<div class="banner okb small">✅ เสร็จสิ้น' +
      (it.receipt_url ? (' • <a href="' + esc(it.receipt_url) + '" target="_blank" rel="noopener">ดูใบเสร็จ</a>') : '') + '</div>');
  } else if (it.stage === 'MGR_REJECTED') {
    h.push('<div class="banner err small"><b>ผู้บริหารไม่อนุมัติ</b><br>' + esc(it.mgr_note || '-') + '</div>');
  }
  return h.join('');
}

function historyArea(it) {
  if (!it.history || !it.history.length) return '';
  return '<details style="margin-top:10px"><summary>ประวัติการตัดสินใจ / History (' + it.history.length + ')</summary>' +
    it.history.map(function (h) {
      return '<div class="hist"><b>' + fmtDT(h.ts) + '</b> • ' + esc(h.actor) + ' (' + esc(h.role) + ')<br>' +
        esc(h.action) + (h.detail ? (' — ' + esc(h.detail)) : '') + '</div>';
    }).join('') + '</details>';
}

/* ---------- การกระทำ ---------- */
function openReason(itemId, action) {
  var box = $('#reason_' + itemId);
  if (box.innerHTML) { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="card" style="background:#fffdf7">' +
    '<label class="req">' + (action === 'CHANGE' ? 'อยากให้แก้ตรงไหน' : 'ทำไมถึงใช้ไม่ได้') + '</label>' +
    '<textarea id="rs_' + itemId + '" placeholder="เช่น ช่วงวัดสั้นไป ต้องการ 0-10 มม. และต้องมีขาแม่เหล็ก"></textarea>' +
    '<div class="btn-row"><button class="btn btn-primary" onclick="decide(\'' + itemId + '\',\'' + action + '\',this)">ส่งให้จัดซื้อ</button></div></div>';
}

function decide(itemId, action, btn) {
  if (needMe()) return;
  var note = ($('#rs_' + itemId) || {}).value || '';
  if (action !== 'CONFIRM' && !note.trim()) { toast('กรุณาระบุเหตุผล', 'err'); return; }
  busy(btn, true, 'กำลังส่ง...');
  api('apiTechSpecDecision', TOKEN, itemId, action, { by: me(), note: note })
    .then(function (d) {
      DTO = d; render();
      toast(action === 'CONFIRM' ? 'ยืนยันสเปคแล้ว — จัดซื้อจะไปเทียบราคาต่อ' : 'ส่งให้จัดซื้อแล้ว', 'ok');
    })
    .catch(function (e) { busy(btn, false); toast(e.message, 'err'); });
}

function openBench(itemId) {
  var box = $('#bench_' + itemId);
  if (box.innerHTML) { box.innerHTML = ''; return; }
  var it = DTO.items.filter(function (x) { return x.item_id === itemId; })[0];
  box.innerHTML = '<div class="card" style="background:#f7fbf8">' +
    '<label class="req">ราคาที่เห็น (ต่อ ' + esc(it.unit) + ')</label>' +
    '<input id="bp_' + itemId + '" type="number" inputmode="decimal" step="0.01" value="' + esc(numOf(it.bench_price) || '') + '" placeholder="บาท">' +
    '<label class="req">ร้าน</label>' +
    '<input id="bs_' + itemId + '" value="' + esc(it.bench_store || DTO.config.benchmarkStore || '') + '">' +
    '<label>หมายเหตุ</label>' +
    '<input id="bn_' + itemId + '" value="' + esc(it.bench_note || '') + '" placeholder="เช่น มีของบนชั้น ซื้อได้เลย">' +
    '<label>รูปป้ายราคา/ตัวสินค้า</label>' +
    '<input id="bf_' + itemId + '" type="file" accept="image/*">' +
    '<div class="btn-row"><button class="btn btn-primary" onclick="sendBench(\'' + itemId + '\',this)">ส่งให้จัดซื้อ</button></div></div>';
}

function sendBench(itemId, btn) {
  if (needMe()) return;
  var payload = {
    by: me(),
    bench_price: numOf($('#bp_' + itemId).value),
    bench_store: $('#bs_' + itemId).value.trim(),
    bench_note: $('#bn_' + itemId).value.trim()
  };
  if (!payload.bench_price) { toast('กรุณาใส่ราคา', 'err'); return; }
  if (!payload.bench_store) { toast('กรุณาใส่ชื่อร้าน', 'err'); return; }
  var f = $('#bf_' + itemId).files[0];
  busy(btn, true, 'กำลังส่ง...');
  (f ? readFileForUpload(f, 1400, 0.82) : Promise.resolve(null))
    .then(function (file) {
      if (file) payload.photo = file;
      return api('apiAddBenchmark', TOKEN, itemId, payload);
    })
    .then(function (d) { DTO = d; render(); toast('ส่งราคาให้จัดซื้อแล้ว', 'ok'); })
    .catch(function (e) { busy(btn, false); toast(e.message, 'err'); });
}

function sendReceipt(itemId, btn) {
  if (needMe()) return;
  var f = $('#rc_' + itemId).files[0];
  if (!f) { toast('กรุณาเลือกรูปใบเสร็จก่อน', 'err'); return; }
  var price = numOf($('#ap_' + itemId).value);
  busy(btn, true, 'กำลังอัปโหลด...');
  readFileForUpload(f, 1800, 0.85)
    .then(function (file) { return api('apiUploadReceipt', TOKEN, itemId, file, me(), price); })
    .then(function (d) { DTO = d; render(); toast('ส่งใบเสร็จแล้ว ขอบคุณครับ', 'ok'); })
    .catch(function (e) { busy(btn, false); toast(e.message, 'err'); });
}

function copyCompany() {
  var c = DTO.config.company;
  copyText([c.name, 'เลขผู้เสียภาษี: ' + c.taxId, 'สาขา: ' + c.branch, 'ที่อยู่: ' + c.address].join('\n'))
    .then(function (ok) { toast(ok ? 'คัดลอกแล้ว ยื่นให้ร้านได้เลย' : 'คัดลอกไม่สำเร็จ', ok ? 'ok' : 'err'); });
}

load(false);
</script>
